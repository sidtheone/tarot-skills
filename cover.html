<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tarot Skills — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #08070b;
    --obsidian: #0e0d12;
    --smoke: #1a1820;
    --ash: #2a2833;
    --silver: #8a8694;
    --bone: #d4d0c8;
    --gold: #c9a84c;
    --gold-dim: rgba(201, 168, 76, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1000px;
    height: 420px;
    overflow: hidden;
    background: var(--void);
    color: var(--bone);
    font-family: 'Crimson Text', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Noise texture */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 10;
  }

  /* Starburst rays from center-left */
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-conic-gradient(
        from 0deg at 30% 50%,
        rgba(201, 168, 76, 0.01) 0deg,
        transparent 2deg,
        transparent 10deg
      );
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse 60% 80% at 30% 50%, black, transparent);
    -webkit-mask-image: radial-gradient(ellipse 60% 80% at 30% 50%, black, transparent);
  }

  /* Background Roman numerals */
  .bg-chars {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    font-family: 'Playfair Display', serif;
    font-size: 180px;
    font-weight: 900;
    font-style: italic;
    opacity: 0.04;
    color: var(--gold);
    pointer-events: none;
    overflow: hidden;
  }

  .container {
    display: flex;
    align-items: center;
    gap: 56px;
    z-index: 1;
    padding: 0 56px;
  }

  /* Card */
  .card {
    flex-shrink: 0;
    width: 240px;
    background: var(--obsidian);
    border: 1px solid var(--ash);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(201, 168, 76, 0.12), 0 0 120px rgba(201, 168, 76, 0.04);
  }

  .card-header {
    position: relative;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(135deg, #12100a, #0e0d12);
  }

  .card-header .bg-glyph {
    font-family: 'Playfair Display', serif;
    font-size: 160px;
    font-weight: 900;
    font-style: italic;
    position: absolute;
    opacity: 0.05;
    user-select: none;
    line-height: 1;
    color: var(--gold);
  }

  .card-number {
    position: absolute;
    top: 12px;
    right: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--silver);
    opacity: 0.5;
  }

  .card-header svg {
    position: relative;
    z-index: 1;
    width: 100px;
    height: 100px;
    filter: drop-shadow(0 4px 24px rgba(201, 168, 76, 0.2));
  }

  .card-body {
    padding: 18px 20px;
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 2px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: var(--bone);
  }

  .card-name .numeral {
    font-size: 0.85rem;
    opacity: 0.4;
    font-style: italic;
  }

  .card-persona {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .card-techniques {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 12px;
  }

  .technique-tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    padding: 3px 8px;
    border-radius: 100px;
    border: 1px solid var(--ash);
    color: var(--silver);
    background: rgba(201, 168, 76, 0.04);
  }

  .card-mechanic {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--silver);
  }

  .card-mechanic .mechanic-value {
    color: var(--gold);
  }

  /* Right side */
  .right {
    flex: 1;
  }

  .right h1 {
    font-family: 'Playfair Display', serif;
    font-size: 44px;
    font-weight: 900;
    font-style: italic;
    line-height: 1.1;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  .right h1 span {
    background: linear-gradient(135deg, #c9a84c, #e8d5a0, #c9a84c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .right .subtitle {
    font-family: 'Crimson Text', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--silver);
    line-height: 1.55;
    margin-bottom: 28px;
    max-width: 460px;
  }

  .stats {
    display: flex;
    gap: 40px;
  }

  .stat .num {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  .stat .label {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    color: var(--silver);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 4px;
  }

  /* Ornamental line under subtitle */
  .ornament {
    width: 120px;
    height: 12px;
    margin-bottom: 28px;
    opacity: 0.35;
  }
</style>
</head>
<body>

<div class="bg-chars">
  <span>XXI</span>
  <span>0</span>
  <span>XIII</span>
  <span>VIII</span>
</div>

<div class="container">
  <div class="card">
    <div class="card-header">
      <span class="bg-glyph">XXI</span>
      <span class="card-number">XXI/XXI</span>
      <!-- The World SVG — dancing figure in laurel wreath -->
      <svg viewBox="0 0 120 120" fill="none">
        <ellipse cx="60" cy="58" rx="32" ry="38" stroke="#c9a84c" stroke-width="2" fill="none"/>
        <path d="M28 58 Q30 50 32 45" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
        <path d="M28 58 Q30 66 32 71" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
        <path d="M92 58 Q90 50 88 45" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
        <path d="M92 58 Q90 66 88 71" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
        <path d="M48 22 Q60 18 72 22" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
        <path d="M48 94 Q60 98 72 94" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
        <circle cx="60" cy="42" r="5" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
        <path d="M60 47 Q58 55 56 62 Q54 68 52 72" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
        <path d="M58 52 Q52 50 48 48" stroke="#c9a84c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M59 54 Q66 53 70 50" stroke="#c9a84c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M54 68 Q58 72 62 76" stroke="#c9a84c" stroke-width="1.5" fill="none"/>
        <path d="M56 64 Q60 68 66 66" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M48 48 Q44 44 42 40" stroke="#c9a84c" stroke-width="0.5" fill="none" opacity="0.4"/>
        <path d="M70 50 Q74 46 76 42" stroke="#c9a84c" stroke-width="0.5" fill="none" opacity="0.4"/>
        <circle cx="20" cy="18" r="3" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M17 20 Q15 24 17 26" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
        <path d="M23 20 Q25 24 23 26" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
        <path d="M97 16 Q100 14 103 16 Q100 18 97 16" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M98 18 L100 22" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
        <path d="M102 18 L100 22" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
        <path d="M17 100 Q15 97 17 95" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M23 100 Q25 97 23 95" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.5"/>
        <circle cx="20" cy="102" r="2.5" stroke="#c9a84c" stroke-width="0.5" fill="none" opacity="0.4"/>
        <circle cx="100" cy="100" r="3" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M96 98 Q94 96 96 94" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
        <path d="M104 98 Q106 96 104 94" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
        <path d="M97 97 Q94 96 93 94" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>
        <circle cx="60" cy="16" r="1" fill="#c9a84c" opacity="0.3"/>
        <circle cx="60" cy="100" r="1" fill="#c9a84c" opacity="0.3"/>
        <circle cx="22" cy="58" r="1" fill="#c9a84c" opacity="0.2"/>
        <circle cx="98" cy="58" r="1" fill="#c9a84c" opacity="0.2"/>
      </svg>
    </div>
    <div class="card-body">
      <div class="card-name">The World <span class="numeral">XXI</span></div>
      <div class="card-persona">The Spread</div>
      <div class="card-techniques">
        <span class="technique-tag">Card Selection</span>
        <span class="technique-tag">Calibration</span>
        <span class="technique-tag">Cross-Card Synthesis</span>
        <span class="technique-tag">Tension Map</span>
      </div>
      <div class="card-mechanic">
        <span class="mechanic-value">Orchestrator</span>
      </div>
    </div>
  </div>

  <div class="right">
    <h1><span>The Major Arcana</span></h1>
    <p class="subtitle">Twenty-two cards. Twenty-two ways your thinking betrays you.</p>
    <svg class="ornament" viewBox="0 0 120 12" fill="none">
      <line x1="0" y1="6" x2="50" y2="6" stroke="#c9a84c" stroke-width="0.5"/>
      <rect x="53" y="2" width="8" height="8" rx="1" transform="rotate(45 57 6)" stroke="#c9a84c" stroke-width="0.5" fill="none"/>
      <line x1="64" y1="6" x2="120" y2="6" stroke="#c9a84c" stroke-width="0.5"/>
    </svg>
    <div class="stats">
      <div class="stat">
        <div class="num">22</div>
        <div class="label">Cards</div>
      </div>
      <div class="stat">
        <div class="num">22</div>
        <div class="label">Defaults Broken</div>
      </div>
      <div class="stat">
        <div class="num">117</div>
        <div class="label">Arcana</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
